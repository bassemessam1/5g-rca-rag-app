name: RAG Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAGAS evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          python evaluation/collect_results.py
          python evaluation/run_ragas.py

      - name: Check quality threshold
        run: |
          python - <<EOF
          import json
          with open("evaluation/ragas_results.json") as f:
              results = json.load(f)
          
          faithfulness = results["faithfulness"]
          relevancy    = results["answer_relevancy"]
          
          print(f"Faithfulness    : {faithfulness:.3f}")
          print(f"Answer Relevancy: {relevancy:.3f}")
          
          if faithfulness < 0.80:
              print("FAILED: Faithfulness below 0.80 threshold")
              exit(1)
          if relevancy < 0.75:
              print("FAILED: Answer relevancy below 0.75 threshold")
              exit(1)
          
          print("PASSED: All quality thresholds met")
          EOF
